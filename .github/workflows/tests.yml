name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Standard library only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -S -m unittest discover -s tests -v
      - run: python -S demo.py --backend portable --auto
      - run: python -S batch.py --backend portable
      - run: bash -n scripts/setup_pi.sh && bash -n run_demo.sh

  model:
    name: Model / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python evaluate.py
      - run: python batch.py
      - name: Reproduce training and verify new artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          python train.py --preview-split
          python train.py
          python -m unittest discover -s tests -v

  formatting:
    name: Python formatting
    runs-on: ubuntu-latest
    env:
      BLACK_CACHE_DIR: ${{ runner.temp }}/black-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install black==26.10.1
      - run: python -m black --check --workers 1 .
